<title>GenFleet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark navy side menu (becomes a slide-out drawer on tablets in portrait and phones), light work area, large tap targets. Dashboard = six summary tiles + status chart + two attention lists. Inventory = searchable table that turns into cards on narrow screens. */
:root{
  color-scheme:light;
  --bg:#eef2f7; --surface:#ffffff; --surface2:#f6f8fb; --ink:#14233b; --muted:#5b6b80; --line:#dde4ed;
  --accent:#1f63c8; --accent-strong:#1f63c8; --accent-ink:#ffffff; --accent-soft:#e3edfb;
  --side:#14233b; --side2:#203658; --side-ink:#d3dded; --side-mute:#8fa3bd;
  --ok:#0f6e36; --ok-bg:#def3e5; --warn:#97440a; --warn-bg:#fdecd3; --bad:#c42b20; --bad-bg:#fbe1de; --info:#1f63c8; --info-bg:#dfeafb; --purple:#3b4d6b; --purple-bg:#e3e8f0; --amber:#946200; --amber-bg:#fbf0cf; --grey:#5b6b80; --grey-bg:#e6eaef;
  --scrim:rgba(10,20,32,.55); --sh:0 1px 2px rgba(16,35,60,.07),0 1px 3px rgba(16,35,60,.05);
  --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c1320; --surface:#141d2c; --surface2:#1a2536; --ink:#e8eef6; --muted:#98a8bc; --line:#26354b;
  --accent:#4d8ff0; --accent-strong:#2b6bd8; --accent-ink:#06142b; --accent-soft:#162f57; --side:#0a111d; --side2:#16253a;
  --ok:#5fcb8a; --ok-bg:#143523; --warn:#f0ad4e; --warn-bg:#3d2b0d; --bad:#f58a80; --bad-bg:#47191a; --info:#7fb0f6; --info-bg:#15294a; --purple:#aebbd0; --purple-bg:#243247; --amber:#e8bd4f; --amber-bg:#3a2f0e; --grey:#a9b6c6; --grey-bg:#222f40;
  --scrim:rgba(0,0,0,.65); --sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1320; --surface:#141d2c; --surface2:#1a2536; --ink:#e8eef6; --muted:#98a8bc; --line:#26354b;
  --accent:#4d8ff0; --accent-strong:#2b6bd8; --accent-ink:#06142b; --accent-soft:#162f57; --side:#0a111d; --side2:#16253a;
  --ok:#5fcb8a; --ok-bg:#143523; --warn:#f0ad4e; --warn-bg:#3d2b0d; --bad:#f58a80; --bad-bg:#47191a; --info:#7fb0f6; --info-bg:#15294a; --purple:#aebbd0; --purple-bg:#243247; --amber:#e8bd4f; --amber-bg:#3a2f0e; --grey:#a9b6c6; --grey-bg:#222f40;
  --scrim:rgba(0,0,0,.65); --sh:0 1px 2px rgba(0,0,0,.4)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.mono{font-family:var(--mono)} .sub{color:var(--muted);font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:15px}

.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:4px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.info{color:var(--info);background:var(--info-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.purple{color:var(--purple);background:var(--purple-bg)} .pill.amber{color:var(--amber);background:var(--amber-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.grey{color:var(--grey);background:var(--grey-bg)}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:16px 12px 16px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;color:#fff;padding:4px 8px 16px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;background:none;border:0;border-radius:8px;padding:0 12px;color:var(--side-ink);cursor:pointer;font-weight:500;text-align:left}
.nav button:hover{background:var(--side2)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav svg{width:20px;height:20px;flex:none}
.nav .soon{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-mute);border:1px solid var(--side2);border-radius:4px;padding:1px 6px}
.nav hr{border:0;border-top:1px solid var(--side2);margin:8px 4px;width:calc(100% - 8px)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side2);font-size:13px;color:var(--side-mute)}
.mainc{min-width:0;display:flex;flex-direction:column}
.topb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.menub{display:none}
.topb .t{font-family:var(--display);font-weight:700;font-size:22px}
.demo{margin-left:auto;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:4px 10px;text-align:center}
.wrap{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;left:0;top:0;bottom:0;width:280px;transform:translateX(-103%);transition:transform .2s}
  .app.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
  .menub{display:inline-flex}
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}
}
@media (min-width:901px){.scrim{display:none}}
@media (max-width:520px){.demo{font-size:12px;padding:3px 8px}.topb .t{display:none}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

.head h1{font-size:38px;line-height:1}
.head p{margin:6px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>h2{font-size:22px;padding:16px 18px 0}
.panel-b{padding:8px 18px 16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc,var(--line));border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:112px}
.tile:hover{border-color:var(--muted);border-top-color:var(--tc)}
.tile .k{font-size:14px;font-weight:600;color:var(--muted)}
.tile .n{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted);margin-top:auto}
.donutw{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:8px 0}
.donut{width:176px;height:176px;flex:none}
.donut .dn{font-family:var(--display);font-weight:700;font-size:10px;fill:var(--ink)}
.donut .dl{font-size:3.2px;fill:var(--muted)}
.legend{display:flex;flex-direction:column;gap:4px;flex:1 1 190px}
.legend button{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:6px;min-height:40px;padding:0 6px;cursor:pointer;text-align:left}
.legend button:hover{background:var(--surface2)}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.grow{flex:1 1 170px;min-width:0}
.code{font-family:var(--mono);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* inventory */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;max-width:420px;min-height:46px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:22px;cursor:pointer;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.fchip span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] span{color:inherit;opacity:.8}
.tw{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
table.t,table.mt{width:100%;border-collapse:collapse}
.t th,.mt th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.t td,.mt td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.t tbody tr:first-child td,.mt tbody tr:first-child td{border-top:0}
.t tbody tr,.mt tbody tr{cursor:pointer}.t tbody tr:hover td,.mt tbody tr:hover td{background:var(--surface2)}
.t .num,.mt .num{text-align:right;font-variant-numeric:tabular-nums}
.meta{padding:0 2px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media (max-width:1060px){
  .t thead{display:none}
  .t,.t tbody{display:block}
  .t tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:14px;border-top:1px solid var(--line)}
  .t tbody tr:first-child{border-top:0}
  .t td{display:block;padding:0;border:0}
  .t td:nth-child(1){grid-column:1;font-size:17px}
  .t td:nth-child(8){grid-column:2;grid-row:1;justify-self:end}
  .t td:nth-child(3){grid-column:1/-1}
  .t td:nth-child(2),.t td:nth-child(4),.t td:nth-child(5),.t td:nth-child(6),.t td:nth-child(7){grid-column:1/-1;font-size:14px;color:var(--muted)}
  .t td:nth-child(2)::before{content:"Serial: "}.t td:nth-child(4)::before{content:"Model: "}.t td:nth-child(5)::before{content:"Colour: "}.t td:nth-child(6)::before{content:"Capacity: "}.t td:nth-child(7)::before{content:"Location: "}
  .t .num{text-align:left}
}
/* detail & placeholder */
.ov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 0}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;padding:20px max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px;margin-top:auto}
@media (min-width:700px){.ov{align-items:center}.dlg{border-radius:14px;margin:auto 0}}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-h h2{font-size:32px}
.dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px}
.dl dt{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--muted)}
.soonp{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:28px 22px}
.soonp h2{font-size:30px;padding:0}
.rm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.rm .panel-b{padding-top:14px}
.rm ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.rm li{margin:3px 0}
/* forms, header actions, toast */
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.fm{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
label.f input,label.f select{min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:400;letter-spacing:0;width:100%;min-width:0}
label.f input[readonly]{background:var(--surface2);color:var(--muted)}
label.f .hint{font-weight:400;font-size:12.5px;letter-spacing:0}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500}
.err:empty{display:none}
.dlg-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toast{pointer-events:none;position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;font-weight:500;max-width:min(92vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sec-actions{display:flex;flex-wrap:wrap;gap:10px}
/* maintenance */
.mfilters{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
label.f textarea{min-height:76px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:400;letter-spacing:0;width:100%;resize:vertical}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:340px}
.mt td{vertical-align:top}.mt td:nth-child(1),.mt td:nth-child(2){white-space:nowrap}.mt .num{white-space:nowrap}
@media (max-width:1060px){
  .mt thead{display:none}.mt,.mt tbody{display:block}
  .mt tr{display:grid;gap:2px 12px;padding:14px;border-top:1px solid var(--line);grid-template-columns:minmax(0,1fr) auto}
  .mt tbody tr:first-child{border-top:0}.mt td{display:block;padding:0;border:0}.mt .num{text-align:left}
  .mt td:nth-child(1){grid-column:1;grid-row:1}
  .mt td:nth-child(4){grid-column:2;grid-row:1;justify-self:end}
  .mt td:nth-child(3){grid-column:1/-1;grid-row:auto;font-size:16px;color:var(--ink)}
  .mt td:nth-child(3) .sub{display:inline;margin-left:6px}
  .mt td:nth-child(2),.mt td:nth-child(5),.mt td:nth-child(6),.mt td:nth-child(7),.mt td:nth-child(8){grid-column:1/-1;font-size:14px;color:var(--muted)}
  .mt td:nth-child(5){color:var(--ink)}.mt .clamp{max-width:none}
  .mt td:nth-child(2)::before{content:"Serviced: "}.mt td:nth-child(6)::before{content:"Technician: "}.mt td:nth-child(7)::before{content:"Total cost: "}.mt td:nth-child(8)::before{content:"Next due: "}
}
/* hire */
.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}}
table.ht{width:100%;border-collapse:collapse}
.ht th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.ht td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
.ht tbody tr:first-child td{border-top:0}.ht tbody tr{cursor:pointer}.ht tbody tr:hover td{background:var(--surface2)}
.ht td:first-child{white-space:nowrap}
@media (max-width:1060px){
  .ht thead{display:none}.ht,.ht tbody{display:block}
  .ht tr{display:block;padding:14px;border-top:1px solid var(--line)}.ht tbody tr:first-child{border-top:0}
  .ht td{display:block;padding:2px 0;border:0;font-size:14px}
  .ht td:first-child{font-size:17px;padding-bottom:4px}
  .ht td::before{content:attr(data-label) ": ";color:var(--muted)}
  .ht td:first-child::before,.ht td.nl::before{content:none}
  .ht td.nl{font-size:16px}
}
/* validation + security plan */
.rq{color:var(--bad);font-weight:700}
.reqnote{font-size:13px;color:var(--muted);margin-bottom:-4px}
label.f.invalid input,label.f.invalid select,label.f.invalid textarea{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fe{color:var(--bad);font-size:13.5px;font-weight:500;letter-spacing:0;line-height:1.35}
.note.live{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
#confirm .ov{z-index:90}
table.pt{width:100%;border-collapse:collapse}
.pt td{padding:7px 0;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
.pt tr:first-child td{border-top:0}.pt .pc{text-align:right;font-family:var(--mono);font-weight:500;white-space:nowrap}
.pt abbr{text-decoration:none;display:inline-block;min-width:20px;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.rmul{margin:8px 0 0;padding-left:18px;color:var(--ink)}.rmul li{margin:6px 0}
/* stage 6: locations and reports */
.sect{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -8px}
.lpill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 6px;font-size:13px;background:var(--surface);color:var(--ink);white-space:nowrap;margin-top:3px}
.lpill svg{width:13px;height:13px}
.lp-workshop{border-color:var(--purple)}.lp-customer{border-color:var(--warn)}.lp-transit{border-style:dashed;border-color:var(--accent)}.lp-depot{border-color:var(--info)}.lp-unknown{border-style:dotted;border-color:var(--muted);color:var(--muted)}
.selx{min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px}
.lhist li{align-items:flex-start}
.samp{border-left:4px solid var(--warn)}
.rbody{display:flex;flex-direction:column;gap:16px}
.rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.rsum>div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rsum .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rsum .n{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

function vMove(v){

  var site=g.status==="hired_out",reason=v.reason,rs=reasonsFor(g),stage=v.stage==="transit"?"transit":"arrived";
  D.reason=reason;D.stage=stage;
  if(rs.indexOf(reason)<0)E.reason="Choose a reason for the movement.";
  if(site&&stage==="transit")E.stage="A hired-out generator cannot be marked in transit here. Record its return on the Hire page.";
  var to=pText("the new location",v.to,{min:3,max:100});
  if(to.v&&!to.e){
    if(/^in transit/i.test(to.v))to.e="Do not type “In transit” as a place. Choose “Left, still in transit” and enter the destination.";
    else if(to.v.toLowerCase()===g.loc.toLowerCase())to.e=g.id+" is already recorded at "+g.loc+". Enter a different location.";

    else if(reason==="Returned from workshop"&&/workshop/i.test(to.v))to.e="That is a workshop. For a move between workshops choose “Transfer between company sites”."}
  if(reason==="Returned from workshop"&&locType(g)!=="workshop")E.reason=g.id+" is not at a workshop, so it cannot be returned from one.";
  if(reason==="Sent to workshop"&&locType(g)==="workshop")E.reason=g.id+" is already at a workshop. Use “Transfer between company sites” to move it to another.";
  var bk=null;

  if(reason==="Moved ahead of a booking"&&!bk&&!E.bookingId)E.bookingId="Choose the booking this move is for.";
  if(bk&&!site&&(g.status==="maintenance"||g.status==="breakdown")&&!E.reason)E.reason=g.id+" is "+STATUS[g.status].l+" and cannot be moved for a booking.";

  var ex={d:null};if(v.expected){ex=pDate("the expected date",v.expected,{max:addYears(T0,2)});if(!ex.e&&at.d&&days(ex.d)<dayOf(at.d))ex.e="The expected date cannot be before the movement date."}

    var D=r.d,b=D.b,g=D.g,code=nextNo(DISP,"DSP-");

    try{
      var res=await client.from("dispatches").insert(payload).select("*").single();if(res.error)throw res.error;dispatchSaved=true;
      var up=await client.from("bookings").update({status:"Hired Out",expected_return_date:toIn(D.expected)}).eq("id",b.dbId);if(up.error)throw up.error;
      var mov=await client.from("location_movements").insert({movement_code:nextNo(MOVES||[],"MOV-"),generator_id:g.dbId,previous_location:g.loc||null,new_location:D.site,movement_time:D.at.toISOString(),movement_stage:"arrived",movement_type:"Dispatched to customer",booking_id:b.dbId,dispatch_id:res.data.id,recorded_by:uuidOrNull(CUR_ID),notes:"Recorded automatically from dispatch "+code,is_automatic:true});if(mov.error)throw mov.error;

    }catch(e){if(dispatchSaved){try{await loadFleetCore();closeModal();toast(code+" dispatch saved; a related update failed: "+(e&&e.message||e))}catch(_){stockError(e)}}else stockError(e)}
  };
  saveRet=async function(f){

    if(!allow("dispatch_return","C"))return;
    var D=r.d,d=D.d,b=D.b,g=D.g,code=nextNo(RETS,"RET-");
    if(!d.dbId||!b.dbId||!g.dbId){toast("Dispatch, booking, and generator must be loaded from Supabase.");return}
    var payload={return_code:code,dispatch_id:d.dbId,return_time:D.at.toISOString(),meter_hours:Number(D.hours),condition:D.cond,fuel_level:D.fuel,damage_or_faults:D.issues||null,needs_workshop_attention:!!D.ws,notes:D.notes||null,recorded_by:uuidOrNull(CUR_ID),return_location:D.loc};var returnSaved=false;

  };


  saveMaint=async function(f){
    if(f.dataset.done)return;
    var edit=f.dataset.edit,r=vMaint(formVals(f),edit);if(Object.keys(r.e).length)return showErrs(f,r.e);
    if(!allow("maintenance",edit?"E":"C"))return;
    var old=edit?MAINT.find(function(m){return m.id===edit}):null;
    if(edit&&!recAllowed(old)){toast("You can edit only your own maintenance records.");return}
    if(r.d.pu.length&&!allow("stockissue","C"))return;
    var D=r.d,g=GENS.find(function(x){return x.id===D.genId});if(!g||!g.dbId){toast("Choose a generator loaded from Supabase.");return}
    var code=edit||nextId2(),techId=uuidOrNull(CUR_ID);
    var payload={maintenance_code:code,generator_id:g.dbId,service_date:toIn(D.date),maintenance_type:D.type,work_performed:D.work,parts_replaced:D.replaced||null,parts_inspected:D.inspected||null,technician:techId,meter_hours:Number(D.hours),next_service_date:toIn(D.next),notes:D.notes||null,created_by:uuidOrNull(CUR_ID)};
    try{
      var res=old&&old.dbId?await client.from("maintenance_records").update(payload).eq("id",old.dbId).select("*").single():await client.from("maintenance_records").insert(payload).select("*").single();
      if(res.error)throw res.error;
      var fin=await client.from("maintenance_financials").upsert({maintenance_record_id:res.data.id,parts_cost:Number(D.parts||0),other_cost:Number(D.other||0),updated_at:new Date().toISOString()},{onConflict:"maintenance_record_id"});if(fin.error)throw fin.error;
      for(var i=0;i<D.pu.length;i++){var x=D.pu[i];await stockRpc({p_item_id:stockDbItem(x.it),p_transaction_type:"Issue",p_quantity:x.qty,p_adjustment_direction:0,p_transaction_time:puAt(D.date).toISOString(),p_unit_cost:x.it.cost,p_party:D.tech||null,p_reference:code,p_reason:"Parts used on maintenance record "+code,p_generator_id:g.dbId,p_maintenance_record_id:res.data.id,p_idempotency_token:x.tok?("m-"+x.tok):tokn()})}
      var gu=await client.from("generators").update({meter_hours:Number(D.hours),next_service_date:toIn(D.next),status:"available"}).eq("id",g.dbId);if(gu.error)throw gu.error;
      f.dataset.done="1";await loadFleetCore();await loadWorkshopStock();closeModal();
      if(S.route!=="maintenance"){S.route="maintenance";try{history.replaceState(null,"","#maintenance")}catch(e){}}
      render();toast(code+(edit?" saved to database.":" recorded in database.")+" "+g.id+" next due "+fmt(D.next)+".");
    }catch(e){stockError(e)}
  };

  saveUser=async function(f){
    if(f.dataset.done)return;var edit=f.dataset.edit,r=vUser(formVals(f),edit);if(Object.keys(r.e).length)return showErrs(f,r.e);
    if(!allow("users",edit?"E":"C"))return;var D=r.d;
    if(!edit){toast("To create a sign-in account, first invite/create its user in Supabase Authentication. Then the profile can be added from the existing Auth user ID. This HTML client cannot securely create Auth users.");return}
    if(edit===CUR_ID){toast("Your own profile is protected. Ask another administrator to update it.");return}
    try{
      var res=await client.from("profiles").update({full_name:D.name,email:D.email,role:D.role,status:D.status}).eq("id",edit).select("id,full_name,email,role,status").single();if(res.error)throw res.error;
      var u=userById(edit);if(u){u.name=res.data.full_name||res.data.email;u.email=res.data.email||"";u.role=res.data.role;u.status=res.data.status;u.assigned=ASG(D.role)?D.assigned:[]}

  userToggle=async function(id){
    var u=userById(id);if(!u||!allow("users","A"))return;
    if(u.id===CUR_ID){toast("You cannot deactivate the account you are using.");return}
    var next=u.status==="active"?"inactive":"active";
    if(u.role==="administrator"&&next==="inactive"&&!activeAdmins(u.id)){toast("This is the only active administrator, so it cannot be deactivated.");return}
    confirmBox((next==="inactive"?"Deactivate ":"Activate ")+u.name+"?","This changes the account profile status in Supabase.","Confirm",async function(){
      try{var res=await client.from("profiles").update({status:next}).eq("id",u.id).select("id").single();if(res.error)throw res.error;u.status=next;render();toast(u.name+" status saved to Supabase.")}catch(e){stockError(e)}
    })
  };
